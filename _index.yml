indexpage:
  title: Documentación de ONTAP Select
  lead: NetApp ONTAP Select es un dispositivo de almacenamiento definido por software
    que puedes implementar en una variedad de servidores de hardware genérico que
    ejecutan el hipervisor VMware ESXi o Kernel-based Virtual Machine (KVM). Te da
    la agilidad que necesitas para construir una infraestructura de nube privada flexible
    y escalable. Este sitio contiene la documentación de ONTAP Select 9.18.1.
